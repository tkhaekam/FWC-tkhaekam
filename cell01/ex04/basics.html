<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
            margin: 0;
            padding: 24px;
        }
        h1 {
            color: #ffffff;
            text-align: center;
            font-size: 40px;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-bottom: 20px;
        }
        .store-card {
            text-align: center;
            background-color: white;
            padding: 15px;
            border-radius: 12px;
        }
        .store-card img {
            width: 220px;
            height: 160px;
            object-fit: contain;
            display: block;
            margin-bottom: 10px;
        }
        footer {
            text-align: right;
            font-family: monospace;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1> ★ Smartphone shopping!! </h1>

    <div class="container">
        <div class="store-card">
            <img src="https://static.vecteezy.com/system/resources/previews/020/336/290/non_2x/samsung-logo-samsung-icon-free-free-vector.jpg" alt="samsung logo">
            <a href="https://www.samsung.com/">Go to samsung</a>
        </div>
        <div class="store-card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple logo">
            <a href="https://www.apple.com">Go to Apple</a>
        </div>
    </div>

    <hr>

    <footer>&copy; tkhaekam 2026</footer>
</body>
</html>
