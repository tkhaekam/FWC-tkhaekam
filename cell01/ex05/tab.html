<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Two Boxes</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            height: 140px;
            padding: 20px;
            border: 1px solid #333;
            font-size: 20px;
        }
        .box-left {
            background-color: red;
        }
        .box-right {
            background-color: purple;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="box-left">First Cat</td>
            <td class="box-right">Second Muhahaha</td>
        </tr>
    </table>
</body>
</html>
